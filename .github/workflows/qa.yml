name: PWA QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
      - name: App and catalogue smoke test
        run: node tests/smoke.cjs
