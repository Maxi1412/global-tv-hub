function favView(){const list=RAW.filter(c=>favorites.has(c.id));return '<div class="section">'+head("Your Favourites",list.length+" saved")+(list.length?'<div class="row-cards">'+list.map(channelCard).join("")+'</div>':'<p class="empty">Your favourite channels will appear here. Add them from the Live TV player.</p>')+'</div>'}
function searchView(){const q=query.toLowerCase();let c=RAW.filter(x=>(x.name+" "+x.genre+" "+x.country).toLowerCase().includes(q)),s=SPORT.filter(x=>(x.name+" "+x.provider+" "+x.group).toLowerCase().includes(q));return '<div class="section">'+head("Search Results",c.length+" channels · "+s.length+" sports")+'<div class="row-cards">'+c.map(channelCard).join("")+s.map(sportCard).join("")+'</div></div>'}
function settings(){return '<div class="section"><h2>Settings</h2><p class="muted">Local-only preferences in this PWA preview.</p></div><div class="panel"><h3>Video</h3><p>Preferred setting: Auto (adaptive, favouring HD if provided). Avoid forcing high bitrate on unstable connections.</p><h3>Stored data</h3><p>Favourites are saved in this browser. Cross-device syncing requires a backend/database in a later build.</p><button class="btn" data-clear="favorites">Clear favourites</button><h3>Source notes</h3><p>The listed six public-stream URLs are candidates and must be validated from Spain. Paid platforms remain official external links. This app does not bypass DRM or territorial rules.</p><span class="badge">Global TV Hub · online preview v0.3</span></div>'}
function render(){if(!routes.includes(section))section="home";if(hls){try{hls.destroy()}catch{}hls=null}const view={home,live,sports:sportsView,guide,favorites:favView,search:searchView,settings}[section];app.innerHTML='<div class="shell"><aside class="side"><div class="brand"><span class="logo">▶</span><span>Global TV Hub</span></div><nav class="nav">'+routes.map(id=>'<button data-nav="'+id+'" class="'+(section===id?"active":"")+'"><span style="font-size:22px;min-width:22px;text-align:center">'+icon[id]+'</span><span>'+names[id]+'</span></button>').join("")+'</nav><div class="aside-note">Global TV Hub v0.3<br>Official channel catalogue<br>HD-first streaming where supported</div></aside><main class="main"><header class="top"><label class="search"><span>⌕</span><input type="search" id="find" placeholder="Search channels, sports, countries..." aria-label="Search channels and sports" value="'+encode(query)+'"></label><div class="top-tag">German · International · Sports</div><div class="avatar">TV</div></header>'+view()+'<footer class="foot">Independent personal TV directory · Not affiliated with broadcasters. Streaming access, rights, subscriptions and quality are controlled by providers. No claim that all listed channels are playable in Spain.</footer></main></div>'}
function navigate(page){if(!routes.includes(page))return;section=page;location.hash=page;render()}
function openSport(id){const s=SPORT.find(x=>x.id===id);if(s)window.open(s.url,"_blank","noopener,noreferrer")}
function quality(message){const p=document.querySelector("#playstatus");if(p)p.textContent=message}
function play(id){const c=RAW.find(x=>x.id===id);if(!c?.hls)return;const v=document.getElementById("video");if(!v)return;const over=document.getElementById("video-placeholder");quality("Connecting to unverified broadcaster source…");let ended=false;const fail=t=>{if(ended)return;ended=true;quality(t+" · Open the official broadcaster page.");v.style.display="none";v.classList.remove("active");over.style.display="block"};
v.onerror=()=>fail("Playback blocked or unsupported");v.onplaying=()=>{quality("Stream playing · Adaptive quality");const x=document.getElementById("quality-text");if(x)x.textContent="Adaptive HLS · Best available"};
if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=c.hls;v.classList.add("active");over.style.display="none";v.play().catch(()=>quality("Press Play inside the player to begin"));return}
const start=()=>{if(!window.Hls||!window.Hls.isSupported())return fail("HLS playback unsupported");hls=new Hls({enableWorker:true,capLevelToPlayerSize:true,lowLatencyMode:true});hls.loadSource(c.hls);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{const levels=hls.levels||[];const highest=Math.max(0,...levels.map(x=>x.height||0));const q=document.getElementById("quality-text");if(q)q.textContent=highest?("Adaptive · up to "+highest+"p source"):"Adaptive · Source quality unknown";over.style.display="none";v.classList.add("active");v.play().catch(()=>quality("Stream ready · Press Play to begin"))});hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal)fail("Source or access failed: "+(d.details||"unknown"))})};
if(window.Hls)return start();const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js";script.onload=start;script.onerror=()=>fail("Unable to load HLS engine");document.head.appendChild(script)}
app.addEventListener("click",e=>{const b=e.target.closest("[data-nav],[data-channel],[data-sport],[data-filter],[data-sport-filter],[data-favorite],[data-play],[data-clear]");if(!b)return;const d=b.dataset;if(d.nav)return navigate(d.nav);if(d.channel){sel=d.channel;return navigate("live")}if(d.sport)return openSport(d.sport);if(d.filter){filter=d.filter;return render()}if(d.sportFilter){sportFilter=d.sportFilter;return render()}if(d.favorite)return favorite(d.favorite);if(d.play)return play(d.play);if(d.clear==="favorites"){favorites.clear();localStorage.setItem("gtv-favs-v03","[]");render()}});
app.addEventListener("input",e=>{if(e.target.id!=="find")return;const pos=e.target.selectionStart;query=e.target.value;section="search";location.hash="search";render();const el=document.getElementById("find");el.focus();try{el.setSelectionRange(pos,pos)}catch{}});
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1);if(routes.includes(p)&&p!==section){section=p;render()}});
render();if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script></body></html>
